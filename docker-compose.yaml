    volumes:
      - ${MEDIA_BASE_PATH}/config/radarr:/config
      - ${MEDIA_BASE_PATH}/Filmy:/movies
      - ${MEDIA_BASE_PATH}/Temp:/downloads
    restart: unless-stopped
    depends_on:
      - gluetun

  # Socat proxy pro Traefik
  sonarr-proxy:
