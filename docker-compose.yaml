version: "3.9"

networks:
  traefik-net:
    external: true
  gluetun-net:
    driver: bridge

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${MEDIA_BASE_PATH}/config/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_CUSTOM_CONFIG=/gluetun/surfshark.ovpn
      - TZ=Europe/Prague
    ports:
      - "8089:8080"   # SABnzbd
      - "8081:8081"   # qbitTorrent
      - "8989:8989"   # Sonarr
      - "7878:7878"   # Radarr
      - "8686:8686"   # Lidarr
      - "9117:9117"   # Jackett
      - "8191:8191"   # FlareSolver
    networks:
      - traefik-net   # Traefik / host access
      - gluetun-net   # VPN traffic
    restart: unless-stopped

  #######################
  # SABnzbd
  #######################
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Prague
      - UMASK_SET=022
    volumes:
      - ${MEDIA_BASE_PATH}/config/sabnzbd:/config
      - ${MEDIA_BASE_PATH}/Temp:/downloads
      - ${MEDIA_BASE_PATH}/Filmy:/movies
      - ${MEDIA_BASE_PATH}/Seriály:/tv
    network_mode: "service:gluetun"
    restart: unless-stopped

  #######################
  # SABnzbd Proxy (pro Traefik)
  #######################
  sabnzbd-proxy:
    image: alpine/socat
    container_name: sabnzbd-proxy
    command: "TCP-LISTEN:8089,fork TCP:gluetun:8080"
    networks:
      - traefik-net
    restart: unless-stopped
    depends_on:
      - gluetun
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.lab`)"
      - "traefik.http.routers.sabnzbd.entrypoints=web"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8089"

  #######################
  # qBittorrent
  #######################
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Prague
      - WEBUI_PORT=8081
      - QBT_USERNAME=${QBT_USERNAME}
      - QBT_PASSWORD=${QBT_PASSWORD}
    volumes:
      - ${MEDIA_BASE_PATH}/config/qbittorrent:/config
      - ${MEDIA_BASE_PATH}/Temp:/downloads
    restart: unless-stopped
    depends_on:
      - gluetun

  #######################
  # Socat proxy pro Traefik (qBittorrent)
  #######################
  qbittorrent-proxy:
    image: alpine/socat
    container_name: qbittorrent-proxy
    command: "TCP-LISTEN:8081,fork TCP:gluetun:8081"
    networks:
      - traefik-net
    restart: unless-stopped
    depends_on:
      - gluetun
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.lab`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8081"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Prague
    volumes:
      - ${MEDIA_BASE_PATH}/config/sonarr:/config
      - ${MEDIA_BASE_PATH}/Seriály:/tv
      - ${MEDIA_BASE_PATH}/Temp:/downloads
    restart: unless-stopped
    depends_on:
      - gluetun

  radarr:
